name: Elixir CI - Linux

on: push

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    name: Linux OTP ${{matrix.pair.otp-version}} / Elixir ${{matrix.pair.elixir-version}}
    strategy:
      matrix:
        # OTP supports the two most recent majors, so 27 and older are dropped.
        pair:
          - otp-version: '29.1'
            elixir-version: '1.20.4'
          - otp-version: '28.5'
            elixir-version: '1.20.4'
          - otp-version: '28.5'
            elixir-version: '1.19.6'
          - otp-version: '28.5'
            elixir-version: '1.18.5'
    steps:
    - uses: actions/checkout@v4
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.pair.otp-version}}
        elixir-version: ${{matrix.pair.elixir-version}}

    - uses: actions/cache@v3
      id: deps-cache
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ matrix.pair.otp-version }}-${{ matrix.pair.elixir-version }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('installer/**/*') }}

    - name: Install ZIGLER_TEST_BLAS
      run: sudo apt install -y libopenblas-dev

    - name: Install dependencies
      run: mix deps.get

    - uses: actions/cache@v3
      id: build-cache
      with:
        path: _build
        key: ${{ runner.os }}-build-${{ matrix.pair.otp-version }}-${{ matrix.pair.elixir-version }}-${{ hashFiles('mix.lock') }}

    - name: Compile base
      run: mix compile

    - name: Get Zig version
      id: zig-version
      run: echo "version=$(mix run --no-compile --no-start -e 'IO.puts(Zig.version())')" >> $GITHUB_OUTPUT

    # mix zig.get installs into ZIG_ARCHIVE_PATH, so cache that rather than a
    # repo-relative `zig` directory that never gets written.
    - uses: actions/cache@v3
      id: zig-cache
      with:
        path: ~/.cache/zigler
        key: ${{ runner.os }}-zig-${{ steps.zig-version.outputs.version }}

    - name: Get Zig
      run: mix zig.get

    - name: Warm the translate-c cache
      run: mix zig.warm

    - name: Run Tests
      env:
        RUNNING_CI: "TRUE"
        ZIGLER_TEST_BLAS: "TRUE"
      run: mix test --exclude no_ci

  credo:
    runs-on: ubuntu-24.04
    name: Credo
    steps:
    - uses: actions/checkout@v4
    - uses: erlef/setup-beam@v1
      with:
        # credo 1.7.x cannot tokenize the ~t() sigil under elixir 1.20, so this
        # job stays on 1.19 until credo supports it.
        otp-version: '28.5'
        elixir-version: '1.19.6'

    - uses: actions/cache@v3
      id: deps-cache
      with:
        path: deps
        key: ${{ runner.os }}-mix-28.5-1.19.6-${{ hashFiles('mix.lock') }}-${{ hashFiles('installer/**/*') }}

    - name: Install dependencies
      run: mix deps.get

    - name: Run Credo
      run: mix credo --strict
